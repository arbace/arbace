<!doctype html>
<!-- Arbace's page (doc/wasm/WEB.md; WAS15 (a)): one canvas, a console and an input line, the shim arbace.js, the module arbace.wasm. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arbace</title>
<style>
  html, body { margin: 0; height: 100%; background: #101018; color: #d8d8e0; font: 13px/1.4 ui-monospace, monospace; }
  body { display: flex; flex-direction: column; }
  #screen { flex: 1; width: 100%; min-height: 0; display: block; }
  #console { margin: 0; max-height: 30vh; overflow: auto; padding: 4px 8px; white-space: pre-wrap; border-top: 1px solid #333; }
  #line { border: 0; border-top: 1px solid #333; background: #181822; color: inherit; font: inherit; padding: 4px 8px; }
</style>
</head>
<body>
<canvas id="screen" tabindex="0"></canvas>
<pre id="console"></pre>
<input id="line" autocomplete="off" spellcheck="false" placeholder="arbace=>">
<script type="module" src="arbace.js"></script>
</body>
</html>
