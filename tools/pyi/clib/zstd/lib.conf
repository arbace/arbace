# zstd 1.5.7 for pyi's _zstd (queue 208; bin/pyi-clib, doc/python/PYTHON-SURVEY.md "After the decisions"): the tarball
# CPython 3.14.10 builds its Windows _zstd from (PCbuild/get_externals.bat's zstd-1.5.7; Misc/externals.spdx.json pins the
# same SHA-256), the upstream release as python/cpython-source-deps tags it. License: BSD 3-Clause (zstd is dual
# licensed BSD/GPLv2; the BSD license taken, LICENSE.md).
url=https://github.com/python/cpython-source-deps/archive/refs/tags/zstd-1.5.7.tar.gz
sha256=f24b52470d12f466e9fa4fcc94e6c530625ada51d7b36de7fdc6ed7e6f499c8e
top=cpython-source-deps-zstd-1.5.7
# the library's four directories as lib/Makefile builds libzstd without threads; -U__x86_64__ -U__amd64__: cpu.h's
# ZSTD_cpuid is inline assembly under __x86_64__ (ci's host), which ci refuses even uncalled, and its portable branch
# answers no BMI2 (the generic code paths); no intrinsics, no assembly, no legacy formats
cflags="-U__x86_64__ -U__amd64__ -DZSTD_NO_INTRINSICS -DZSTD_DISABLE_ASM -DZSTD_LEGACY_SUPPORT=0"
includes="lib lib/common"
glue="pyzstd.c"
sources="lib/common/debug.c lib/common/entropy_common.c lib/common/error_private.c lib/common/fse_decompress.c lib/common/pool.c lib/common/threading.c lib/common/xxhash.c lib/common/zstd_common.c lib/compress/fse_compress.c lib/compress/hist.c lib/compress/huf_compress.c lib/compress/zstd_compress.c lib/compress/zstd_compress_literals.c lib/compress/zstd_compress_sequences.c lib/compress/zstd_compress_superblock.c lib/compress/zstd_double_fast.c lib/compress/zstd_fast.c lib/compress/zstd_lazy.c lib/compress/zstd_ldm.c lib/compress/zstd_opt.c lib/compress/zstd_preSplit.c lib/compress/zstdmt_compress.c lib/decompress/huf_decompress.c lib/decompress/zstd_ddict.c lib/decompress/zstd_decompress.c lib/decompress/zstd_decompress_block.c lib/dictBuilder/cover.c lib/dictBuilder/divsufsort.c lib/dictBuilder/fastcover.c lib/dictBuilder/zdict.c"
