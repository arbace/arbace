# CPython 3.14.10's C tokenizer for lex-check's own reference (queue 489; py-own-judge-1 (a), the user, 2026-11-20;
# bin/pyi-clib, bin/repr-python lex-check's REPR_PYTHON_LEX_REF=own): Parser/lexer/, Parser/tokenizer/'s helpers and
# readline tokenizer, Parser/token.c and Python/Python-tokenize.c (the _tokenize module: TokenizerIter's rules), with
# Objects/unicodectype.c (the identifier scan's XID tables) and Python/pyctype.c (Py_ISDIGIT's table), from the release
# tarball test/python/corpora.edn pins (:cpython-3.14.10), unmodified, built by ci in Py_BUILD_CORE_MODULE's mode as a
# release build (NDEBUG) against CPython's own Include/ with Arbace's pyconfig.h (tools/pyi/capi/include), behind this
# directory's harness, tokharness.c (its main: tools/pydump/tokdump.py's format), linked with musl. A program, not a
# library pyi loads: bin/pyi-clib exe builds it. License: the PSF's (LICENSE.md).
