# The C world of pyi's ctypes (queues 244, 262; bin/pyi-clib, doc/python/PYTHON-SURVEY.md "As built: 244", "As built: 262"):
# CPython 3.14.10's own test library, Modules/_ctypes/_ctypes_test.c (with its _ctypes_test_generated.c.h), and since
# queue 262 its _testlimitedcapi (Modules/_testlimitedcapi.c and Modules/_testlimitedcapi/*.c, but heaptype_relative.c
# and vectorcall_limited.c, whose types PyType_FromSpec would make: their Init functions are pyctypes's natives that
# add nothing), from the release tarball test/python/corpora.edn pins (:cpython-3.14.10), built by ci against CPython's
# own Include/ in its limited API's mode (every source defines Py_LIMITED_API) with Arbace's pyconfig.h
# (tools/pyi/capi/include), and linked with musl: the C library test_ctypes loads (CDLL(_ctypes_test.__file__)) and the
# extension modules pyctypes makes from their PyInit. License: the PSF's (LICENSE.md).
