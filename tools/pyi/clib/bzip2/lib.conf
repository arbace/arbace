# bzip2 1.0.8 for pyi's _bz2 (queue 208; bin/pyi-clib, doc/python/PYTHON-SURVEY.md "As built: 208"): the tarball
# CPython 3.14.10 builds its Windows _bz2 from (PCbuild/get_externals.bat's bzip2-1.0.8; Misc/externals.spdx.json
# pins the same SHA-256), the upstream release as python/cpython-source-deps tags it. License: bzip2's (LICENSE.md).
url=https://github.com/python/cpython-source-deps/archive/refs/tags/bzip2-1.0.8.tar.gz
sha256=ab8d1b0cc087c20d4c32c0e4fcf7d0c733a95da12cedc6d63b3f0a9af07427e2
top=cpython-source-deps-bzip2-1.0.8
# the library's files as its Makefile builds libbz2.a (OBJS), without its stdio part (BZ_NO_STDIO: the module calls
# only the six stream functions); the C glue of this directory first
cflags="-DBZ_NO_STDIO"
sources="blocksort.c huffman.c crctable.c randtable.c compress.c decompress.c bzlib.c"
glue="pybz2.c"
