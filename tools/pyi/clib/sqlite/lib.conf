# SQLite 3.50.4 for pyi's _sqlite3 (queue 215; doc/python/PYTHON-SURVEY.md "As built: 215"): the amalgamation CPython 3.14.10
# builds its Windows _sqlite3 from (PCbuild/get_externals.bat's sqlite-3.50.4.0; Misc/externals.spdx.json pins the same
# SHA-256), as python/cpython-source-deps tags it. License: public domain (LICENSE.md).
url=https://github.com/python/cpython-source-deps/archive/refs/tags/sqlite-3.50.4.0.tar.gz
sha256=fb5ab81f27612b0a7b4861ba655906c76dc85ee969e7a4905d2075aff931e8d0
top=cpython-source-deps-sqlite-3.50.4.0
# the first slice's options: no threads (SQLITE_THREADSAFE=0: the GIL is held around every call, so C never runs in two
# goroutines; sqlite3.threadsafety 0, which test_sqlite3 accepts), no loadable extensions (no dlopen in ci), no memory
# statistics' mutex; -U__x86_64__ -U__amd64__ as zstd's (no inline assembly reached: sqlite3.c's rdtsc and the
# byte-swap builtins are guarded by them); SQLITE_DISABLE_INTRINSIC: GCC_VERSION 0, so no __sync_synchronize, no
# __builtin_bswap/overflow/clz (SQLite's portable C for each); ci has no __atomic builtins (sqlite3_open faulted on
# "undefined function __atomic_store_n") and its preprocessor answers __has_extension(c_atomic) as the reference
# compiler, 1, so SQLite's AtomicLoad/AtomicStore still name them: they are plain loads and stores here (one C thread)
# and the options CPython's own build of this amalgamation gives it (PCbuild/sqlite3.vcxproj: math functions, FTS4,
# FTS5, R*Tree, no automatic initialization; module_exec calls sqlite3_initialize)
cflags="-DSQLITE_ENABLE_MATH_FUNCTIONS -DSQLITE_ENABLE_FTS4 -DSQLITE_ENABLE_FTS5 -DSQLITE_ENABLE_RTREE -DSQLITE_OMIT_AUTOINIT -DNDEBUG -U__x86_64__ -U__amd64__ -DSQLITE_DISABLE_INTRINSIC -D__atomic_load_n(p,o)=(*(p)) -D__atomic_store_n(p,v,o)=(*(p)=(v)) -DSQLITE_THREADSAFE=0 -DSQLITE_OMIT_LOAD_EXTENSION -DSQLITE_DEFAULT_MEMSTATUS=0"
includes=""
glue="pysqlite.c"
sources="sqlite3.c"
