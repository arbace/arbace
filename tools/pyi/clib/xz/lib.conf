# XZ Utils 5.2.5's liblzma for pyi's _lzma (queue 208; bin/pyi-clib, doc/python/PYTHON-SURVEY.md "As built: 208"): the
# tarball CPython 3.14.10 builds its Windows _lzma from (PCbuild/get_externals.bat's xz-5.2.5; Misc/externals.spdx.json
# pins the same SHA-256), the upstream release as python/cpython-source-deps tags it. liblzma is in the public domain
# (its COPYING; LICENSE.md).
url=https://github.com/python/cpython-source-deps/archive/refs/tags/xz-5.2.5.tar.gz
sha256=a15c168e39e87d750c3dc766edc7f19bdda57dacf01e509678467eace91ad282
top=cpython-source-deps-xz-5.2.5
# src/liblzma's liblzma.la as its Makefile builds it with this directory's config.h (configure's: the encoders and
# decoders of every filter, the CRC32, CRC64 and SHA-256 checks, no threads); the C glue of this directory first
cflags="-DHAVE_CONFIG_H"
includes="src/liblzma/api src/liblzma/common src/liblzma/check src/liblzma/lz src/liblzma/rangecoder src/liblzma/lzma src/liblzma/delta src/liblzma/simple src/common"
glue="pylzma.c"
