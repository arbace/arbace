# CPython 3.14.10's parser for parse-check's own reference (queue 494; py-own-judge-1 (a), the user, 2026-11-20;
# bin/pyi-clib, bin/repr-python parse-check's REPR_PYTHON_PARSE_REF=own): Parser/parser.c (pegen's generated parser),
# pegen.c, pegen_errors.c, action_helpers.c, string_parser.c and peg_api.c, Python/Python-ast.c (the tree's
# constructors), asdl.c and pyarena.c, Python/future.c and ast_preprocess.c (what compile()'s PyCF_ONLY_AST path runs
# after the parser), the tokenizer as queue 489 built it (Parser/lexer/, Parser/tokenizer/'s helpers and readline
# tokenizer, with the string and UTF-8 tokenizers the parser reads from; Parser/token.c; Python/Python-tokenize.c for
# mode :full's token stream), Python/mystrtoul.c (the numbers), Objects/unicodectype.c and Python/pyctype.c, from the
# release tarball test/python/corpora.edn pins (:cpython-3.14.10), unmodified, built by ci in Py_BUILD_CORE_MODULE's mode as a release build (NDEBUG) against
# CPython's own Include/ with Arbace's pyconfig.h (tools/pyi/capi/include), behind this directory's harness,
# parseharness.c (its main: tools/pydump/pydump.py tree's format; unicodedata's NFKC and \N{...}'s names copied from
# Modules/unicodedata.c into it, their tables read at run time from the tarball's Modules/unicodedata_db.h and
# unicodename_db.h: compiled in, their initializers took cf2g past 4 GiB), linked with musl. A program, not a library pyi
# loads: bin/pyi-clib exe builds it. License: the PSF's (LICENSE.md).
